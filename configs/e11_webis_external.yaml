schema_version: 1
status: frozen_before_generation

source:
  dataset: Webis-ArgQuality-20
  version: 1.0.0
  doi: 10.5281/zenodo.3780049
  paper: https://aclanthology.org/2020.acl-main.511/
  license: CC-BY-4.0
  files:
    full:
      path: datasets/external/webis_argquality20/source/webis-argquality20-full.csv
      sha256: b31796edd58dcb10960401d409ac9be0fd3d0d9465d2d2f673cb8dac1d4944e3
    topics:
      path: datasets/external/webis_argquality20/source/webis-argquality20-topics.csv
      sha256: 5afd781a9c190387e8e54bd1a1161d1409da48db5a8b5d8146502fc9d439a8bd
    logical:
      path: datasets/external/webis_argquality20/source/webis-argquality20-pairwise-logical.csv
      sha256: 94fd407e8ea8153b126e57d7c60c26a80dc6c05ef22bdb9ae5305439cb9768b2
    rhetorical:
      path: datasets/external/webis_argquality20/source/webis-argquality20-pairwise-rhetorical.csv
      sha256: 1d03d191dd1b1c1631c260b678d2a5bfd2566d5498cfe73f85c8350a829e965e
    dialectical:
      path: datasets/external/webis_argquality20/source/webis-argquality20-pairwise-dialectical.csv
      sha256: c261b8aea1804b7ef0df7af6db6a7a2fe914a7e0c6df7424c4e99ddd017c67bb

preparation:
  require_is_argument: true
  require_same_topic: true
  require_same_stance: true
  primary_gold: majority_of_logical_rhetorical_dialectical
  primary_scope: majority_decisive
  sensitivity_scopes:
    - unanimous_decisive
    - majority_all_tie_aware
    - logical_decisive
    - rhetorical_decisive
    - dialectical_decisive
    - combined_quality_decisive
  pilot_topic_count: 2
  pilot_hash_namespace: e11-webis-pilot-topic-v1
  generation_pilot: datasets/external/webis_argquality20/e11_pilot_groups.jsonl
  generation_formal: datasets/external/webis_argquality20/e11_formal_groups.jsonl
  pairs_pilot: datasets/external/webis_argquality20/e11_pilot_pairs.jsonl
  pairs_formal: datasets/external/webis_argquality20/e11_formal_pairs.jsonl
  manifest: configs/splits/e11_webis_manifest.json

model: qwen3_8b
generation:
  decoding: hard
  thinking: false
  do_sample: true
  temperature: 0.7
  top_p: 0.95
  repetition_penalty: 1.0
  max_new_tokens: 12

stages:
  pilot:
    dataset: datasets/external/webis_argquality20/e11_pilot_groups.jsonl
    pairs: datasets/external/webis_argquality20/e11_pilot_pairs.jsonl
    candidates: results/uq_apo/candidates/e11_pilot_candidates.jsonl
    seeds: [42, 1024]
    output: results/uq_apo/raw/e11_webis_pilot.jsonl
  formal:
    dataset: datasets/external/webis_argquality20/e11_formal_groups.jsonl
    pairs: datasets/external/webis_argquality20/e11_formal_pairs.jsonl
    candidates: results/uq_apo/candidates/e11_three_prompts.jsonl
    seeds: [42, 1024, 2026, 31415, 27182, 16180, 57721, 65537, 99991, 104729]
    output: results/uq_apo/raw/e11_webis_external.jsonl

prompts:
  winner: p_53a4acbe525c
  manual:
    direct: p_83adf7318fd5
    rubric: p_0086c8edb3b1

analysis:
  independent_cluster: topic_id
  primary_scope: majority_decisive
  bootstrap_resamples: 10000
  permutation_resamples: 100000
  random_seed: 42
  holm_family: winner_vs_two_manual_baselines_within_scope_and_metric
  estimate_seeds: [42, 1024, 2026, 31415, 27182]
  heldout_seeds: [16180, 57721, 65537, 99991, 104729]
  bayesian_confidence_thresholds: [0.60, 0.70, 0.80, 0.90]
  adaptive_checkpoints: [3, 5, 7, 10]
  dirichlet_prior_concentration: 0.5

interpretation_lock:
  winner_is_frozen: true
  external_results_may_change_winner: false
  pilot_topics_excluded_from_formal: true
  no_prompt_rewriting_after_pilot: true
  confirmatory_claim: >-
    Compare the already-frozen Qwen winner with Direct and Rubric on direct
    human pairwise argument-quality labels from previously unused topics.
